<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17385D">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gépnapló">
<title>Szihalom Worklog</title>
<style>
:root{
  --navy:#17385D; --pale:#D9E2F3; --faint:#F5F7FA; --rule:#C7CCD6;
  --amber:#FFF2CC; --amber-line:#E0B84A; --ink:#1A3A8F; --red:#B42318; --red-bg:#FDECEA;
  --green:#1E7B45; --green-bg:#E5F4EA; --grey:#5B6270; --bg:#EEF1F6; --card:#FFFFFF;
  --sans:Carlito,Calibri,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --serif:"Noto Serif",Cambria,Georgia,"Times New Roman",serif;
  --hand:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.chk{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;text-align:left;cursor:pointer;font-size:13.5px}
.chk input{flex:0 0 auto;width:22px;height:22px}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:#1c2230;font:15px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.chrome{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;max-width:1100px;margin:0 auto}
.topbar h1{font-size:17px;font-weight:700;letter-spacing:.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar h1 small{font-weight:400;opacity:.75;margin-left:6px;font-size:13px}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:2px 10px;font-size:12.5px;white-space:nowrap}
.pill.warn{background:var(--amber);color:#5a4300}
.lang{display:flex;border:1px solid rgba(255,255,255,.4);border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:4px 9px;font-size:13px;cursor:pointer}
.lang button.on{background:#fff;color:var(--navy);font-weight:700}
.tabs{display:flex;max-width:1100px;margin:0 auto;padding:0 8px;overflow-x:auto}
.tabs button{flex:1 0 auto;background:none;border:0;color:rgba(255,255,255,.75);padding:6px 6px 7px;cursor:pointer;border-bottom:3px solid transparent;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs .ti{font-size:19px;line-height:1.1}
.tabs button.gear{flex:0 0 auto;padding:6px 12px}
.tabs button.gear .tl{display:none}
.tabs button.on{color:#fff;border-bottom-color:#fff;font-weight:700}
main{max-width:1100px;margin:0 auto;padding:14px 16px 80px}
section[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.muted{color:var(--grey)}
.small{font-size:13px}
.btn{border:1px solid var(--rule);background:#fff;border-radius:9px;padding:8px 13px;cursor:pointer;min-height:40px;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.btn.danger{color:var(--red);border-color:#e7b4ae}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.alert{border-radius:10px;padding:10px 12px;margin:0 0 12px;border:1px solid}
.alert.warn{background:var(--amber);border-color:var(--amber-line);color:#4d3a00}
.alert.err{background:var(--red-bg);border-color:#e7b4ae;color:#7a1a10}
.alert.info{background:var(--pale);border-color:#b7c6e3;color:var(--navy)}
.alert.ok{background:var(--green-bg);border-color:#a8d5b7;color:#14532d}
.grouph{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--navy);margin:18px 2px 8px;font-weight:700;display:flex;gap:8px;align-items:center}
.grouph .line{flex:1;height:1px;background:var(--rule)}
/* day screen — big targets for the site crew */
.today{padding:16px}
.today.weekend{border-left:6px solid var(--amber-line)}
.dhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.bigdate{font-size:30px;font-weight:700;color:var(--navy);line-height:1.1}
.wd{font-size:16px;color:var(--grey)}
.other{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--grey)}
.other input{border:1px solid var(--rule);border-radius:8px;padding:6px 8px;min-height:40px;background:#fff}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{border-radius:14px;border:2px solid;overflow:hidden;display:flex;flex-direction:column}
.tile.on{border-color:var(--green);background:var(--green-bg)}
.tile.off{border-color:#cfd4dc;background:#f1f2f5}
.tmain{border:0;background:none;padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;min-height:86px;flex:1}
.tname{font-weight:700;font-size:16px;line-height:1.2}
.tstate{font-size:14px;font-weight:700}
.tile.on .tstate{color:var(--green)} .tile.off .tstate,.tile.off .tname{color:#7a808b}
.tstep{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #a8d5b7;background:#fff}
.tstep button{border:0;background:none;font-size:24px;width:48px;height:44px;cursor:pointer;color:var(--green)}
.tstep b{font-size:15px;white-space:nowrap}
.btn.huge{width:100%;min-height:60px;font-size:20px;border-radius:14px}
.btn.green{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.hint{text-align:center;color:var(--grey);font-size:14px;margin:8px 0 4px}
.done{text-align:center;background:var(--green-bg);color:var(--green);font-size:19px;font-weight:700;border-radius:14px;padding:16px;margin-bottom:8px}
.row.center{justify-content:center}
.more{margin-top:14px;border-top:1px dashed var(--rule);padding-top:10px}
.more summary{cursor:pointer;color:var(--grey)}
.histh{font-size:14px;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin:20px 2px 8px}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;min-height:52px}
.hrow.weekend{border-left:5px solid var(--amber-line)}
.hrow .hd{min-width:120px} .hrow .hm{flex:1;font-size:14px}
.sigthumb{height:26px;vertical-align:middle;margin-left:4px}
@media (max-width:440px){#stagePill{display:none}}
/* machine pictures */
.mimg{display:block;position:relative;width:100%;aspect-ratio:120/72;border-radius:10px;overflow:hidden;background:linear-gradient(#eaf2fb,#f7f9fc 70%,#e5e0d4 70%)}
.mimg svg{display:block;width:100%;height:100%}
.mimg img{display:block;width:100%;height:100%;object-fit:cover}
.mimg .mnum{position:absolute;right:6px;top:4px;background:var(--navy);color:#fff;border-radius:6px;padding:0 6px;font-size:13px}
.tile .mimg{border-radius:0;margin:-14px -10px 6px;width:calc(100% + 20px)}
.tile.off .mimg{filter:grayscale(1);opacity:.45}
.mrow .mimg{width:96px;border:1px solid var(--rule)}
/* calculator */
.ctiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (min-width:700px){.ctiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ctile{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center}
.cname{font-weight:700;font-size:15px;line-height:1.2;min-height:2.4em;display:flex;align-items:center;justify-content:center}
.cstep{display:flex;align-items:center;gap:4px}
.cstep button{width:40px;height:44px;border-radius:10px;border:1px solid var(--rule);background:var(--faint);font-size:22px;cursor:pointer;color:var(--navy);flex:0 0 auto}
.cstep input{flex:1;min-width:0;text-align:center;font-size:24px;font-weight:700;color:var(--navy);border:1px solid var(--rule);border-radius:10px;height:44px}
.crange{width:100%;accent-color:var(--navy)}
.calcsum .big{font-size:30px;font-weight:700;color:var(--navy);line-height:1.2;margin:2px 0 6px}
.k{font-size:12.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.5px}
.mid{font-size:22px;font-weight:700;color:var(--navy);margin-top:2px}
.card.hl{border:2px solid var(--navy);background:var(--pale)}
.kinds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.kind{border:2px solid var(--rule);border-radius:10px;background:#fff;padding:4px;font-size:12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:stretch}
.kind.on{border-color:var(--navy);background:var(--pale);font-weight:700}
.tile.add{border:2px dashed #9fb0cf;background:#fff;align-items:center;justify-content:center;color:var(--navy);font-weight:700;font-size:16px;cursor:pointer;min-height:120px}
/* PO comparison + extension request */
.overbox{border:2px solid var(--red);background:#fffafa}
.ctile .po{font-size:12.5px;color:var(--grey)}
.ctile .ov{font-size:13px;font-weight:700;color:var(--red);min-height:1.2em}
.ctile.over{border-color:var(--red)}
.xdoc-holder{margin:0 0 16px;overflow:hidden}
.xdoc{width:210mm;min-height:296.5mm;padding:50pt 51pt 64pt;position:relative;background:#fff;color:#000;font-family:var(--serif);font-variant-numeric:lining-nums;font-size:9.6pt;line-height:13.2pt;box-shadow:0 2px 12px rgba(0,0,0,.15);margin:0 auto}
.xdoc .run{position:absolute;top:28pt;right:51pt;font-weight:700;font-size:8.5pt;color:var(--navy)}
.xdoc .runrule{position:absolute;top:45pt;left:51pt;right:51pt;border-top:.6pt solid var(--rule)}
.xdoc .footrule{position:absolute;bottom:52pt;left:51pt;right:51pt;border-top:.6pt solid var(--rule)}
.xdoc .foot{position:absolute;bottom:36pt;left:51pt;right:51pt;display:flex;justify-content:space-between;font-size:7.6pt;color:#666;line-height:1}
.xdoc .brand{font-weight:700;font-size:10.5pt;line-height:13.5pt;color:var(--navy);margin-top:6pt}
.xdoc h1{font-size:17pt;line-height:21pt;color:var(--navy);font-weight:700;margin-top:1pt}
.xdoc .sub{font-size:10pt;line-height:13pt;color:#666;margin:2pt 0 9pt}
.xdoc .parties{display:grid;grid-template-columns:1fr 1fr;background:var(--faint);border:.5pt solid var(--rule);border-top:2.2pt solid var(--navy)}
.xdoc .parties>div{padding:7pt 11pt 8pt}
.xdoc .parties>div+div{border-left:.5pt solid var(--rule)}
.xdoc .ph{font-weight:700;font-size:7.6pt;line-height:10.2pt;color:var(--navy);margin-bottom:2pt}
.xdoc .pn{font-weight:700;font-size:10pt;line-height:13pt;color:var(--navy)}
.xdoc .pt{font-size:8.4pt;line-height:11.4pt}
.xdoc table{border-collapse:collapse;width:100%}
.xdoc table.lab{border:.5pt solid var(--rule);margin-top:7pt}
.xdoc table.lab td{padding:5pt 8pt;font-size:8.6pt;line-height:11.6pt;vertical-align:middle}
.xdoc table.lab td.k{background:var(--pale);font-weight:700;color:var(--navy);border-bottom:.5pt solid #fff;text-transform:none;letter-spacing:0;font-size:8.6pt}
.xdoc h2{font-family:Carlito,Calibri,"Segoe UI",sans-serif;font-weight:700;font-size:11.5pt;line-height:14pt;color:var(--navy);margin:8pt 0 3pt}
.xdoc p{margin:0 0 4pt}
.xdoc table.plant{border:.5pt solid var(--rule)}
.xdoc table.plant th{background:var(--navy);color:#fff;font-weight:700;font-size:8pt;line-height:10.4pt;padding:4pt 5pt;text-align:left}
.xdoc table.plant td{font-size:8.4pt;line-height:11.2pt;padding:4pt 5pt;border-bottom:.4pt solid var(--rule);vertical-align:middle}
.xdoc .c{text-align:center}.xdoc .r{text-align:right}.xdoc .b{font-weight:700}
.xdoc table.plant th.c{text-align:center}.xdoc table.plant th.r{text-align:right}
.xdoc tr.net td{border-top:.8pt solid var(--navy);background:var(--pale)}
.xdoc tr.gross td{background:var(--pale)}
.xdoc .note{font-size:8.2pt;line-height:11pt;color:#666;margin-top:3pt}
.xdoc .sigs2{display:grid;grid-template-columns:1fr 1fr;gap:30pt;margin-top:8pt;text-align:center}
.xdoc .sigspace{height:46pt;display:flex;align-items:flex-end;justify-content:center}
.xdoc .sigspace svg{display:block}
.xdoc .sigrule{width:150pt;margin:0 auto 2pt;border-top:.6pt solid #000}
.xdoc .sigrole{font-size:8.5pt;line-height:11.4pt}
.xdoc .sigwho{font-weight:700;font-size:8.8pt;line-height:11.8pt;color:var(--navy)}
.xdoc .sigmeta{font-size:7.4pt;line-height:10pt;color:#666}
/* lock screen */
body.locked .chrome,body.locked main{display:none}
.lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:16px;z-index:70}
.lock[hidden]{display:none}
.lockcard{background:#fff;border-radius:16px;padding:24px 20px;width:min(390px,100%);text-align:center;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.lockicon{font-size:38px;line-height:1}
.lockcard h2{color:var(--navy);font-size:20px}
.lockcard input[type=password]{font-size:28px;letter-spacing:6px;text-align:center;border:2px solid var(--rule);border-radius:12px;padding:10px;min-height:58px}
.lockerr{color:var(--red);min-height:1.3em;font-weight:700}
.lockcard.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lockbtn{background:none;border:0;color:#fff;font-size:18px;cursor:pointer;padding:4px 6px}
.fixprice{background:var(--green-bg);border:1px solid #a8d5b7;border-radius:10px;padding:10px 12px;font-size:16px}
.fixprice .k{display:block;margin-bottom:2px}
/* where & what */
.twork{border:0;border-top:1px solid #a8d5b7;background:#fff;padding:8px 10px;text-align:left;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--navy);display:flex;flex-direction:column;gap:2px;min-height:44px}
.twork small{font-weight:400;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.twork.need{background:var(--amber);color:#5a4300}
.wcard{width:min(720px,100%)}
.wmap{position:relative;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:#f3f6ee;margin-top:4px}
.wmap .sitemap{display:block;width:100%;height:min(46vh,360px);touch-action:manipulation}
.wmapbtns{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.sitemap .blk polygon{fill:#dfe8d2;stroke:#5f7d3a;cursor:pointer}
.sitemap .blk.on polygon{fill:#17385D;stroke:#17385D}
.sitemap .blk text{fill:#33461e;font-family:Arial,sans-serif;font-weight:700;pointer-events:none}
.sitemap .blk.on text{fill:#fff}
.sitemap .pin text{font-family:Arial,sans-serif;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:.25em}
.wsel{margin:8px 2px;font-weight:700;color:var(--green);min-height:1.3em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:8px 13px;cursor:pointer;font-size:14px;min-height:40px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.winput{width:100%;border:1px solid var(--rule);border-radius:9px;padding:9px 10px;font-size:15px;margin-top:8px;min-height:42px}
#v-print{display:none}
.trv{color:var(--navy);font-weight:700}
.whead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.scrollx{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.scrollx>*{flex:0 0 auto}
.chipdate{display:inline-flex;align-items:center;gap:4px;padding:4px 8px}
.chipdate input{border:0;background:none;font-size:14px;max-width:130px}
.mpick{display:flex;gap:8px;margin-top:6px}
.mp{width:108px;border:2px solid var(--rule);border-radius:12px;background:#fff;padding:4px 4px 6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:center;font-size:12.5px;font-weight:700;position:relative}
.mp .mimg{border-radius:8px}
.mp i{font-style:normal;font-size:12px;color:var(--grey);font-weight:400}
.mp.on{border-color:var(--navy);background:var(--pale)}
.mp.idle{opacity:.45;cursor:not-allowed}
.stoptabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip.add{border-style:dashed;color:var(--navy);font-weight:700}
.chip.del{color:var(--red);border-color:#e7b4ae}
.travel{margin-top:12px;background:var(--pale);border-radius:10px;padding:10px 12px;color:var(--navy)}
.wfoot{position:sticky;bottom:-16px;background:#fff;padding:10px 0 4px;margin-top:12px;border-top:1px solid var(--rule)}
/* Hol-Mit tab */
.wcardm{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--green);border-radius:14px;padding:10px;margin-bottom:10px}
.wcardm.need{border-color:var(--amber-line);background:#fffbef}
.wcardm.off{border-color:#d6d9df;opacity:.6}
.wmart{position:relative;width:96px;flex:0 0 96px}
.wmart .mimg{border-radius:10px}
.wmart .dot.big{position:absolute;left:-4px;top:-4px;width:16px;height:16px;border-radius:50%;border:2px solid #fff}
.wminfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:14.5px}
.wmplace{font-weight:700;color:var(--navy)}
.warnc{color:#8a6100}
.wmbtn{flex:0 0 auto}
@media (max-width:480px){.wcardm{flex-wrap:wrap}.wmbtn{width:100%;min-height:48px;font-size:16px}}
/* consolidation sheet (A4 landscape) */
.cons-holder{margin:0 0 16px;overflow:hidden}
.cons-page{width:297mm;height:209.5mm;padding:12mm 12mm 14mm;position:relative;background:#fff;color:#000;font-family:var(--serif);font-size:8.6pt;line-height:11pt;box-shadow:0 2px 12px rgba(0,0,0,.15);margin:0 auto;overflow:hidden}
.cons-page .ch{display:flex;justify-content:space-between;gap:10mm;align-items:flex-start;border-bottom:2pt solid var(--navy);padding-bottom:3mm;margin-bottom:3mm}
.cons-page .cb{font-weight:700;font-size:9pt;color:var(--navy)}
.cons-page h1{font-size:14pt;line-height:17pt;color:var(--navy);margin:1pt 0}
.cons-page .cs{color:#666;font-size:9pt}
.cons-page table{border-collapse:collapse}
.cons-page .cm td{padding:1pt 4pt;font-size:8pt;vertical-align:top}
.cons-page .cm td:first-child{color:var(--navy);font-weight:700;white-space:nowrap}
.cons-page .ct{width:100%}
.cons-page .ct th{background:var(--navy);color:#fff;text-align:left;padding:3pt 5pt;font-size:8pt}
.cons-page .ct td{border-bottom:.4pt solid var(--rule);padding:2.5pt 5pt;vertical-align:middle;height:7.2mm}
.cons-page .ct tr.first td{border-top:.9pt solid var(--navy)}
.cons-page .ct .c{text-align:center}
.cons-page .dt span{color:#666;font-size:7.6pt}
.cons-page .dot{display:inline-block;width:7pt;height:7pt;border-radius:50%;margin-right:4pt;vertical-align:-0.5pt}
.cons-page .miss{color:#B42318;font-style:italic}
.cons-page .nosig{color:#999}
.cons-page .sg svg{display:block;margin:0 auto}
.cons-page .cf{position:absolute;left:12mm;right:12mm;bottom:7mm;display:flex;justify-content:space-between;font-size:7.4pt;color:#666;border-top:.5pt solid var(--rule);padding-top:2mm}
.cons-page .cmap{height:96mm;border:.5pt solid var(--rule);background:#f6f8f2;margin-bottom:3mm}
.cons-page .cmap svg{width:100%;height:100%;display:block}
.cons-page .lg td{height:auto;padding:2pt 5pt}
.cons-page .wmk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 80pt Arial,sans-serif;color:rgba(180,35,24,.08);transform:rotate(-18deg);pointer-events:none}
/* status */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.stat .k{font-size:12.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:24px;font-weight:700;color:var(--navy);line-height:1.2;margin-top:2px}
.stat .s{font-size:13px;color:var(--grey)}
.bar{height:14px;border-radius:7px;background:#e3e7ef;overflow:hidden;display:flex;margin:6px 0}
.bar i{display:block;height:100%}
.bar .b1{background:var(--navy)} .bar .b2{background:#6d8fc4} .bar .b3{background:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--grey)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:7px 9px;font-weight:700;white-space:nowrap}
table.t td{padding:7px 9px;border-bottom:1px solid var(--rule);vertical-align:top}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tr.tot td{background:var(--pale);font-weight:700}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--grey);min-width:0}
.fld input,.fld select,.fld textarea{border:1px solid var(--rule);border-radius:8px;padding:7px 9px;font-size:15px;color:#1c2230;background:#fff;min-height:40px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.card h2{font-size:16px;color:var(--navy);margin-bottom:10px}
.card h3{font-size:14.5px;color:var(--navy);margin:12px 0 8px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;min-height:40px}
.seg button.on{background:var(--navy);color:#fff;font-weight:700}
.sigbox{border:1px solid var(--rule);border-radius:10px;padding:10px;flex:1;min-width:230px;background:var(--faint)}
.sigbox img,.sigbox svg{max-height:50px;max-width:100%;display:block;margin:4px 0}
.mpic{display:flex;flex-direction:column;gap:4px;width:110px}
.mpic .mimg{width:110px}
.mrow{display:grid;grid-template-columns:110px 1.4fr 1fr 1fr 1fr 1fr 1fr auto;gap:8px;align-items:end;padding:8px 0;border-bottom:1px dashed var(--rule)}
.lrow{display:grid;grid-template-columns:50px 1.4fr 1.4fr 80px 70px 130px auto;gap:8px;align-items:end;padding:8px 0;border-bottom:1px dashed var(--rule)}
@media (max-width:760px){.mrow,.lrow{grid-template-columns:1fr 1fr}.mrow>.mpic{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;width:auto;align-items:center}}
.tests li{margin:2px 0}
.tests .p{color:var(--green)} .tests .f{color:var(--red);font-weight:700}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.modal[hidden]{display:none}
.mcard{background:#fff;border-radius:14px;padding:16px;width:min(640px,100%);max-height:96vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mcard h3{color:var(--navy);font-size:18px;margin-bottom:4px}
.handover{background:var(--amber);border:1px solid var(--amber-line);border-radius:10px;padding:10px 12px;margin:8px 0;font-weight:700;color:#4d3a00}
.padwrap{position:relative;border:2px dashed #9fb0cf;border-radius:10px;background:#fffef9;margin:10px 0;touch-action:none}
.padwrap canvas{display:block;width:100%;height:220px;touch-action:none;cursor:crosshair}
.padwrap .base{position:absolute;left:8%;right:8%;bottom:46px;border-top:1px solid #c5cfdf;pointer-events:none}
.padwrap .x{position:absolute;left:5%;bottom:48px;color:#9fb0cf;font-size:20px;pointer-events:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1c2230;color:#fff;padding:9px 16px;border-radius:9px;z-index:60;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw}
#toast.on{opacity:1}
/* documents */
.docs-out{margin-top:6px}
.sheet-page{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.15);margin:0 0 16px}
.sheet-page svg{display:block;width:100%;height:auto}
.lb text.f{font-family:Arial,Helvetica,sans-serif;fill:#000}
.lb text.h{font-family:var(--hand);fill:var(--ink)}
.lb text.g{font-family:Arial,Helvetica,sans-serif;fill:#555}
.lb text.b{font-weight:700}
.lb text.wm{font-family:Arial,sans-serif;font-weight:700;fill:rgba(180,35,24,.13)}
@page{size:A4;margin:0}
@page land{size:A4 landscape;margin:0}
@page port{size:A4 portrait;margin:0}
@media print{
  body{background:#fff}
  .chrome,.no-print,#toast,.modal{display:none!important}
  main{padding:0;max-width:none}
  main>section:not(.printing){display:none!important}
  .docs-out{margin:0}
  .sheet-page{page:land;width:297mm;height:209.5mm;margin:0;box-shadow:none;break-after:page;overflow:hidden}
  .sheet-page svg{width:297mm;height:210mm}
  .xdoc-holder{page:port;margin:0;break-after:page}
  .cons-holder{page:land;margin:0;break-after:page}
  #v-print.printing{display:block!important}
  .cons-page{zoom:1!important;box-shadow:none;margin:0}
  .xdoc{zoom:1!important;box-shadow:none;margin:0;height:296.5mm;min-height:0;overflow:hidden}
  .docs-out>:last-child{break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

const MONTHS_EN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function t(k, v) {
  let s = (T[S.lang] && T[S.lang][k]) ?? T.en[k] ?? k;

/* --------------------------------------------------------------- helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad2 = n => String(n).padStart(2, '0');
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isoD = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayIso = () => isoD(new Date());
const dow = s => parseD(s).getDay();
const isWeekend = s => { const w = dow(s); return w === 0 || w === 6; };

function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return isoD(d); }
function enLong(s) { const d = parseD(s); return `${d.getDate()} ${MONTHS_EN[d.getMonth()]} ${d.getFullYear()}`; }
function enPeriod(a, b) {
  if (!a) return '';
  if (a === b) return enLong(a);
  const A = parseD(a), B = parseD(b);
  if (A.getFullYear() !== B.getFullYear()) return `${enLong(a)} – ${enLong(b)}`;
  if (A.getMonth() === B.getMonth()) return `${A.getDate()}–${B.getDate()} ${MONTHS_EN[B.getMonth()]} ${B.getFullYear()}`;
  return `${A.getDate()} ${MONTHS_EN[A.getMonth()]} – ${enLong(b)}`;
}
function uiDate(s) {
  if (!s) return '';
  const d = parseD(s);
  return S.lang === 'hu' ? `${d.getFullYear()}. ${pad2(d.getMonth() + 1)}. ${pad2(d.getDate())}.` : enLong(s);
}

const fmtHUF = c => Math.round(c / 100 * S.po.rate).toLocaleString(S.lang === 'hu' ? 'hu-HU' : 'en-GB') + ' ' + t('huf');

function normalize(o) {
  const b = seed();
  const s = Object.assign({}, b, o);
  s.po = Object.assign({}, b.po, o.po || {});
  s.parties = { contractor: Object.assign({}, b.parties.contractor, o.parties?.contractor), client: Object.assign({}, b.parties.client, o.parties?.client) };
  s.numbering = Object.assign({}, b.numbering, o.numbering);
  s.signers = Object.assign({}, b.signers, o.signers);
  s.prices = Object.assign({}, b.prices, o.prices);
  s.speeds = Object.assign({}, SPEED_DEF, b.speeds, o.speeds);
  const KIND_BY_LINE = { dozer: 'dozer', exc: 'excavator', tip: 'tipper' };
  s.machines = (o.machines || b.machines).map(m => ({ type: '', inv: '', operator: '', ...m, kind: m.kind || KIND_BY_LINE[m.line] || 'other' }));
  s.machines.forEach(m => { if (m.rate === undefined || m.rate === '') m.rate = defaultRate(s, m); });
  s.ext = Object.assign({ plan: {}, reason: '', date: '', sig: {} }, o.ext);
  s.days = (o.days || []).map(d => ({ date: d.date, start: Number(d.start ?? 7), note: d.note || '', hours: d.hours || {}, sig: d.sig || {}, work: d.work || {} }));
  s.stages = (o.stages || []).map((x, i) => ({ no: i + 1, to: x.to, issued: x.issued || x.to, certNo: x.certNo || '', logFrom: Number(x.logFrom || 1), sig: x.sig || {} }));

function sortAll(s) {
  s.days.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  s.stages.sort((a, b) => a.to < b.to ? -1 : 1);

function readPhoto(file, done) {
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 480 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    done(c.toDataURL('image/jpeg', 0.72));
  };
  img.onerror = () => toast(t('badPhoto'));

/* ---------------------------------------------------------- Calculator
   Same PO rule as the billing: each line = round(lineTotal x days/20).
   Set days per machine and everything recounts as you go. */
/* ------------------------------------------- Price list & PO comparison
   Every machine carries the daily rate it was sold at. Work inside the PO
   is billed by the PO rule; work beyond it (extra days, machines not on
   the PO) is valued at the sold rate — that is what a PO extension has to
   cover, and the extension request below explains it to the Client. */
const rateC = m => toCents(m.rate || 0);
function defaultRate(s, m) {
  const l = s.po.lines.find(x => x.id === m.line);
  const cap = l ? capOf(s, l) : 0;
  return cap ? Math.round(toCents(l.poTotal) / cap) / 100 : 0;
}
const actualDays = () => Object.fromEntries(S.machines.map(m => [m.id, S.days.filter(d => worked(d, m.id)).length]));
function poCompare(map) {
  const rows = S.po.lines.map(l => {
    const ms = machinesOf(S, l.id), units = Math.max(1, Number(l.units) || 1), cap = capOf(S, l);
    const ud = ms.reduce((a, m) => a + (Number(map[m.id]) || 0), 0);
    const inUD = Math.min(ud, cap), overUD = ud - inUD;
    const rate = ms.length ? Math.round(ms.reduce((a, m) => a + rateC(m), 0) / ms.length) : 0;
    return {
      line: l, ms, units, poDays: lineDaysOf(S, l), onPO: cap > 0, ud, days: ud / units, overUD, overDays: overUD / units, rate,
      net: cap ? Math.round(toCents(l.poTotal) * inUD / cap) : 0, overVal: overUD * rate,
    };
  });
  const net = rows.reduce((a, x) => a + x.net, 0), over = rows.reduce((a, x) => a + x.overVal, 0), po = poNetCents(S);
  return { rows, net, over, overVat: vatOf(S, over), po, newPo: po + over, rem: po - net };
}

/* ---------------------------------------------------- Phone -> office
   Each phone keeps its own data. "Send to office" shares an encrypted file

const FILE_APP = 'szihalom-worklog';

  return new File([body], name, { type: 'text/plain' });
}
function download(file) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name;

async function shareToOffice() {

    catch (e) { if (e.name === 'AbortError') return; }

}
async function readWorklogFile(text) {

}
const validSigCount = d => { const h = dayHash(d); return ['contractor', 'client'].filter(r => sigState(d.sig?.[r], h) === 'ok').length; };

  const res = { added: 0, sigs: 0, updated: 0, kept: 0, machines: 0 };
  for (const l of o.po?.lines || []) if (!S.po.lines.some(x => x.id === l.id)) S.po.lines.push(clone(l));
  for (const m of o.machines || []) if (!S.machines.some(x => x.id === m.id)) { S.machines.push(clone(m)); res.machines++; }
  for (const d0 of o.days || []) {
    const d = { date: d0.date, start: Number(d0.start ?? 7), note: d0.note || '', hours: clone(d0.hours || {}), sig: clone(d0.sig || {}), work: clone(d0.work || {}) };
    const mine = S.days.find(x => x.date === d.date);
    if (!mine) { S.days.push(d); res.added++; continue; }
    if (dayKey(mine) === dayKey(d)) {               // same day, same hours: collect any new signatures
      const h = dayHash(d);
      for (const r of ['contractor', 'client']) if (sigState(d.sig[r], h) === 'ok' && sigState(mine.sig[r], h) !== 'ok') { mine.sig[r] = d.sig[r]; res.sigs++; }
      if (!mine.note && d.note) mine.note = d.note;
      continue;
    }
    // different hours: the better-signed (then more recently signed) version wins
    const a = validSigCount(d), b = validSigCount(mine);
    if (a > b || (a === b && a > 0 && lastSigAt(d) > lastSigAt(mine))) { Object.assign(mine, d); res.updated++; }

}

/* ------------------------------------------------ Where & what, per day
   For each machine and day the crew marks one or more STOPS — where it
   worked (block of the site plan / a point / GPS) and what it did there.
   Travel between stops (and from the previous working day's last place) is
   estimated: straight line x ROAD_F, at the machine's typical speed. All of
   it is part of the signed day and feeds the client's consolidation.
   Site plan: vault "site" (local metres, y down), from the grass-cutting
   drawing (UTM 34N). Older single-place marks ({b, x, y, …}) read as one stop. */
let SITE = null;
const ACTS = {
  dozer: [['grade', 'Tereprendezés, planírozás', 'Site levelling / grading'], ['road', 'Útépítés, útjavítás', 'Access road construction / repair'],
    ['spread', 'Kő / föld terítés', 'Spreading stone / soil'], ['backfill', 'Árok visszatöltés', 'Trench backfilling'],
    ['clear', 'Területtisztítás', 'Site clearing'], ['compact', 'Tömörítés', 'Compaction']],
  excavator: [['trench', 'Kábelárok ásás', 'Cable trench excavation'], ['dig', 'Földkiemelés', 'Excavation'],
    ['load', 'Billencs rakodás', 'Loading trucks'], ['backfill', 'Visszatöltés', 'Backfilling'],
    ['ditch', 'Vízelvezető árok', 'Drainage ditch'], ['found', 'Alapozás előkészítés', 'Foundation preparation']],
  tipper: [['stone', 'Kő szállítás', 'Stone haulage'], ['soil', 'Föld szállítás', 'Soil haulage'],
    ['spoil', 'Kitermelt anyag elszállítása', 'Spoil removal'], ['transfer', 'Anyagmozgatás a területen', 'On-site material transfer']],
  other: [['earth', 'Földmunka', 'Earthworks'], ['haul', 'Szállítás', 'Haulage'], ['load', 'Rakodás', 'Loading']],

const actList = m => ACTS[m.kind] || ACTS.other;
function actLabel(m, key, lang) {
  const a = actList(m).find(x => x[0] === key) || Object.values(ACTS).flat().find(x => x[0] === key);
  return a ? (lang === 'en' ? a[2] : a[1]) : key;
}
const stopEmpty = s => !s || (!s.b && s.x == null && !(s.acts || []).length && !s.note && !s.place);
const stopsOf = w => !w ? [] : (Array.isArray(w.stops) ? w.stops : [w]).filter(s => !stopEmpty(s));

  return [where, s.place].filter(Boolean).join(' – ');
}

function workText(m, w, lang) {

  return st.length > 1 ? st.map((s, i) => `${i + 1}. ${workOne(m, s, lang) || '—'}`).join('; ') : (st[0] ? workOne(m, st[0], lang) : '');
}
function pip(x, y, r) {

/* ---- travel between stops (estimate) */
const SPEED_DEF = { dozer: 3, excavator: 3, tipper: 15, other: 5 };     // km/h on site
const ROAD_F = 1.25;                                                     // straight line -> around the panel rows
const speedOf = m => Number(S.speeds?.[m.kind]) || SPEED_DEF[m.kind] || 5;
function prevStop(date, mid) {
  const d = S.days.filter(x => x.date < date && worked(x, mid) && stopsOf(workOf(x, mid)).some(s => s.x != null)).at(-1);
  return d ? { date: d.date, s: stopsOf(d.work[mid]).filter(s => s.x != null).at(-1) } : null;
}
function travelOf(date, m, w) {
  const st = stopsOf(w).filter(s => s.x != null), legs = [];
  const pv = prevStop(date, m.id);
  if (pv && st.length) { const d = Math.hypot(pv.s.x - st[0].x, pv.s.y - st[0].y); if (d > 40) legs.push({ from: pv.s, to: st[0], m: d, prev: pv.date }); }
  for (let i = 1; i < st.length; i++) legs.push({ from: st[i - 1], to: st[i], m: Math.hypot(st[i].x - st[i - 1].x, st[i].y - st[i - 1].y) });

  return { legs, km, min: km / speedOf(m) * 60, prev: pv };
}

  if (!tr || !tr.legs.length || tr.km < 0.05) return '';
  const km = (Math.round(tr.km * 10) / 10).toFixed(1), kmS = lang === 'en' ? km : km.replace('.', ',');
  const h = Math.floor(tr.min / 60), mn = Math.round(tr.min % 60);
  const time = h ? (lang === 'en' ? `${h} h ${mn} min` : `${h} óra ${mn} perc`) : (lang === 'en' ? `${mn} min` : `${mn} perc`);
  return `${kmS} km · ~${time}`;
}

/* ---- the marking window: ① day ② machine ③ where (one or more places) ④ what */
function openWork(mid) {
  if (!SITE) return toast('No site plan');

  const curDay = () => selDay();

  const mach = () => S.machines.find(x => x.id === ed.mid);
  const newStop = () => ({ b: '', x: null, y: null, acts: [], note: '', place: '' });
  const load = () => {
    const w = (srcOf().work || {})[ed.mid];

    ed.si = 0; ed.vb = null;
  };
  const persist = () => {
    const sd = curDay(), src = srcOf(), keep = ed.stops.filter(s => !stopEmpty(s));

    if (before === after) return true;
    if (sd.entry && !guardDayEdit(sd.entry)) return false;

        out.push([d.date, WD.en[dow(d.date)], m.name, num(Number(d.hours[m.id])), s ? i + 1 : '', s ? placeOne(s, 'en') : 'not marked', s ? (s.b || '').replace('-', '/') : '', E, N,
          s ? workOne(m, s, 'en') : '', s ? workOne(m, s, 'hu') : '', s ? legTo(s) : '',
          i === 0 && tr.km >= 0.05 ? num((Math.round(tr.km * 10) / 10).toFixed(1)) : '', i === 0 && tr.km >= 0.05 ? Math.round(tr.min) : '',
          validSig(d.sig.contractor, h)?.name || '', validSig(d.sig.client, h)?.name || ''].map(q).join(';'));
      });
    }
  }
  return '﻿' + out.join('\r\n');
}

function repSpan() {
  const sel = selDay().date, ds = S.days.map(d => d.date);
  if ((UI.repRange || 'week') === 'day') return [sel, sel];
  if (UI.repRange === 'all') return ds.length ? [ds[0], ds.at(-1)] : [sel, sel];
  const mon = addDays(sel, -((dow(sel) + 6) % 7));
  return [mon, addDays(mon, 6)];
}

    try { await navigator.share({ files: [file], title: t('repTitle') }); return; } catch (e) { if (e.name === 'AbortError') return; }

  download(file); toast(t('shareSaved'));
}

  if (!SITE) return '';

  for (const d of S.days) {

    need += ms.length; done += ms.length - miss.length;

  const pct = need ? Math.round(100 * done / need) : 100;
  return `<div class="card">

  ['Gépmunkaóra', 34], ['TMK', 22], ['géphiba', 26], ['időjárás', 26], ['állás', 22], ['munkahiány', 28], ['mennyiség', 28],

function signFlow(steps, done) {
  // steps: [{role, title}] — each signs in turn on this device
  const results = {};
  let i = 0;
  const next = () => {
    if (i >= steps.length) { done(results); return; }
    const st = steps[i];
    openPad(st, i > 0, sig => { results[st.role] = sig; i++; next(); }, () => { if (Object.keys(results).length) done(results); });
  };
  next();
}
/* ============================================================ SIGNATURE INK
   Signatures are kept as vector pen strokes — [x, y, width] per point —
   never as pixels, and drawn as SVG curves, so a printout is sharp at any
   resolution. Width follows the hand like a ballpoint: thinner when the
   stroke is fast, fuller when slow or (with a stylus) when pressed. */
const INK = '#1b2c6e';
const PEN = { min: 1.0, max: 3.0 };                 // pad pixels
const hasInk = sig => !!(sig && (sig.vec || sig.png));
function inkSegs(pts) {                             // pts: [{x, y, w}] -> [{d, w}]
  const f = n => +n.toFixed(1), P = p => `${f(p.x)} ${f(p.y)}`;
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const n = pts.length;
  if (n === 1) return [{ d: `M${P(pts[0])}l0.01 0`, w: pts[0].w }];
  if (n === 2) return [{ d: `M${P(pts[0])}L${P(pts[1])}`, w: (pts[0].w + pts[1].w) / 2 }];
  const out = [{ d: `M${P(pts[0])}L${P(mid(pts[0], pts[1]))}`, w: pts[0].w }];
  for (let i = 1; i < n - 1; i++) out.push({ d: `M${P(mid(pts[i - 1], pts[i]))}Q${P(pts[i])} ${P(mid(pts[i], pts[i + 1]))}`, w: pts[i].w });
  out.push({ d: `M${P(mid(pts[n - 2], pts[n - 1]))}L${P(pts[n - 1])}`, w: pts[n - 1].w });
  return out;
}
/* sigMarkup(sig, boxW, boxH, unit, extraAttrs, penMax)
   penMax: the thickest line in the output, in the box's units — like the
   tip of a real pen, it stays the same whatever size the signature is. */
function sigMarkup(sig, bw, bh, unit = '', extra = '', penMax = 1.1) {
  const head = vb => `<svg ${extra} width="${+bw.toFixed(2)}${unit}" height="${+bh.toFixed(2)}${unit}" viewBox="${vb}" preserveAspectRatio="xMidYMax meet" aria-label="signature">`;
  if (!sig) return '';
  if (!sig.vec) return sig.png ? head('0 0 300 100') + `<image href="${sig.png}" width="300" height="100" preserveAspectRatio="xMidYMax meet"/></svg>` : '';
  const { w, h, s } = sig.vec;
  const scale = Math.min(bw / w, bh / h);
  const k = Math.min(penMax / (scale * PEN.max), 0.05 * h / PEN.max);   // pen-tip correction
  const groups = new Map();
  for (const flat of s) {
    const pts = [];
    for (let i = 0; i < flat.length; i += 3) pts.push({ x: flat[i], y: flat[i + 1], w: flat[i + 2] });
    for (const sg of inkSegs(pts)) {
      const q = +(Math.round(sg.w * k / 0.04) * 0.04).toFixed(2) || 0.04;
      groups.set(q, (groups.get(q) || '') + sg.d);
    }
  }
  return head(`0 0 ${w} ${h}`) + `<g fill="none" stroke="${INK}" stroke-linecap="round" stroke-linejoin="round">`
    + [...groups].map(([q, d]) => `<path stroke-width="${q}" d="${d}"/>`).join('') + '</g></svg>';
}

function openPad({ role, title }, handover, onSave, onCancel) {
  const m = $('#modal');
  const party = S.parties[role].name;
  m.innerHTML = `<div class="mcard" role="dialog" aria-modal="true">
    <h3>${esc(t('signFor', { p: party }))}</h3>
    <div class="muted small">${esc(title)}</div>
    ${handover ? `<div class="handover">\u{1F91D} ${esc(t('handover', { p: party }))}</div>` : ''}
    <label class="fld" style="margin-top:10px">${esc(t('signName'))}<input type="text" id="padName" value="${esc(S.signers[role] || '')}" autocomplete="name"></label>
    <div class="padwrap"><canvas id="pad"></canvas><div class="base"></div><div class="x">✕</div></div>
    <div class="small muted">${esc(t('signHint'))}</div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="padClear">${esc(t('clear'))}</button><span class="spacer"></span>
      <button class="btn" id="padCancel">${esc(t('cancel'))}</button>
      <button class="btn primary" id="padSave">${esc(t('save'))}</button>
    </div></div>`;
  m.hidden = false;
  document.body.style.overflow = 'hidden';
  const cv = $('#pad'), ctx = cv.getContext('2d');
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.scale(dpr, dpr);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.fillStyle = INK;
  const strokes = [];
  let cur = null, vel = 0;
  const pos = e => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top, t: e.timeStamp, p: e.pressure }; };
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const seg = (a, c, b, w) => { ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a.x, a.y); c ? ctx.quadraticCurveTo(c.x, c.y, b.x, b.y) : ctx.lineTo(b.x, b.y); ctx.stroke(); };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    const p = pos(e); vel = 0;
    cur = { pen: e.pointerType === 'pen', pts: [{ x: p.x, y: p.y, t: p.t, w: PEN.max * 0.55 }] };
    strokes.push(cur);
  });
  cv.addEventListener('pointermove', e => {
    if (!cur) return; e.preventDefault();
    const co = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    for (const ev of (co.length ? co : [e])) {
      const p = pos(ev), pts = cur.pts, last = pts.at(-1);
      const d = Math.hypot(p.x - last.x, p.y - last.y);
      if (d < 1.2) continue;
      vel = 0.6 * vel + 0.4 * d / Math.max(1, p.t - last.t);          // px per ms, smoothed
      let w = PEN.max / (1 + vel * 1.3);
      if (cur.pen && p.p > 0) w *= 0.45 + 1.1 * p.p;                     // stylus pressure
      w = Math.max(PEN.min, Math.min(PEN.max, 0.65 * last.w + 0.35 * w));
      pts.push({ x: p.x, y: p.y, t: p.t, w });
      const n = pts.length;
      if (n === 2) seg(pts[0], null, mid(pts[0], pts[1]), pts[0].w);
      else seg(mid(pts[n - 3], pts[n - 2]), pts[n - 2], mid(pts[n - 2], pts[n - 1]), pts[n - 2].w);
    }
  });
  const up = () => {
    if (!cur) return;
    const pts = cur.pts, n = pts.length;
    if (n === 1) { ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, pts[0].w / 2, 0, Math.PI * 2); ctx.fill(); }
    else { pts[n - 1].w *= 0.6; seg(mid(pts[n - 2], pts[n - 1]), null, pts[n - 1], pts[n - 1].w); }   // lift-off taper
    cur = null;
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  const close = () => { m.hidden = true; m.innerHTML = ''; document.body.style.overflow = ''; };
  $('#padClear').onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); strokes.length = 0; };
  $('#padCancel').onclick = () => { close(); onCancel && onCancel(); };
  $('#padSave').onclick = () => {
    const name = $('#padName').value.trim();
    const len = strokes.reduce((a, s) => a + s.pts.length, 0);
    if (len < 3) { toast(t('emptySig')); return; }
    if (!name) { toast(t('needName')); $('#padName').focus(); return; }
    // crop to the ink; store vectors (1 decimal) — a few KB, crisp at any size
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const s of strokes) for (const p of s.pts) { x0 = Math.min(x0, p.x - p.w); y0 = Math.min(y0, p.y - p.w); x1 = Math.max(x1, p.x + p.w); y1 = Math.max(y1, p.y + p.w); }
    x0 -= 2; y0 -= 2;
    const rd = n => Math.round(n * 10) / 10;
    const vec = { w: rd(x1 - x0 + 2), h: rd(y1 - y0 + 2), s: strokes.map(s => s.pts.flatMap(p => [rd(p.x - x0), rd(p.y - y0), rd(p.w)])) };
    S.signers[role] = name;
    close();
    onSave({ name, vec, at: new Date().toISOString() });
  };
  setTimeout(() => $('#padName') && !$('#padName').value && $('#padName').focus(), 50);
}

function selfTest() {

  const full = () => Object.fromEntries(s.machines.map(m => [m.id, 10]));
  const addWeekdays = (st, from, n) => { let d = from; for (let i = 0; i < n; i++) { do d = addDays(d, 1); while (isWeekend(d)); st.days.push({ date: d, start: 7, note: '', hours: full(), sig: {} }); } return d; };
  const c1 = rangeCalc(s, null, to1), k = c1.days.length;
  ok('Stage 1 lines', c1.lines.map(x => fmtEN(x.net)).join(' | '), E.s1Lines);
  ok('Stage 1 net', fmtEN(c1.net), E.s1Net);
  ok('Stage 1 VAT', fmtEN(c1.vat), E.s1Vat);
  ok('Stage 1 gross', fmtEN(c1.gross), E.s1Gross);
  ok('Stage 1 machine hours', c1.hours, E.s1Hours);
  ok('Remaining after stage 1', fmtEN(c1.remNet), E.s1Rem);
  ok('Remaining days per line', c1.lines.map(x => x.remDays).join(','), E.s1RemDays);
  ok('PO net', fmtEN(poNetCents(s)), E.poNet);
  ok('PO VAT / gross', fmtEN(vatOf(s, poNetCents(s))) + ' / ' + fmtEN(poNetCents(s) + vatOf(s, poNetCents(s))), E.poVatGross);
  const s2 = clone(s), end = addWeekdays(s2, to1, N - k);
  const c2 = rangeCalc(s2, to1, end);
  ok('Stage 2 net', fmtEN(c2.net), E.s2Net);
  ok('Stage 1 + stage 2 = PO', fmtEN(c1.net + c2.net), E.poNet);
  ok('Per line: stage 1 + stage 2 = PO line', c1.lines.map((x, i) => fmtEN(x.net + c2.lines[i].net)).join(' | '), s.po.lines.map(l => fmtEN(toCents(l.poTotal))).join(' | '));
  const s3 = clone(s); addWeekdays(s3, to1, 1);
  const c3 = rangeCalc(s3, null, null);
  ok('One more day = round(PO line x n/N)', c3.lines.map(x => x.net).join(','), s3.po.lines.map(l => Math.round(toCents(l.poTotal) * (k + 1) / N)).join(','));
  ok('Open stage = cum(n) - cum(n-1)', rangeCalc(s3, to1, null).net, c3.net - c1.net);
  const s4 = clone(s), tips = machinesOf(s4, s4.po.lines[2].id);
  s4.days[0].hours[s4.machines[0].id] = 0; s4.days[0].hours[tips[1].id] = 0;
  const c4 = rangeCalc(s4, null, null);
  ok('Idle machine day not billed', fmtDaysEN(c4.lines[0].days), String(k - 1));
  ok('One idle unit = half a line-day', fmtDaysEN(c4.lines[2].days), String(k - 0.5));
  ok('Idle net = PO line x (n-1)/N', c4.lines[0].net, Math.round(toCents(s.po.lines[0].poTotal) * (k - 1) / N));
  const s5 = clone(s2); addWeekdays(s5, end, 2);
  const c5 = rangeCalc(s5, null, null);
  ok('Beyond PO: billing capped at PO net', fmtEN(c5.net), E.poNet);
  ok('Beyond PO: overage flagged', c5.lines[0].overUD, 2);
  ok('Beyond PO: nothing remaining', c5.remNet, 0);
  const keep = S; S = s5;
  try {
    const pc = poCompare(actualDays());
    ok('Beyond PO: value at sold rates', fmtEN(pc.over), E.over22);
    ok('Beyond PO: amended PO', fmtEN(pc.newPo), E.newPo22);
  } finally { S = keep; }
  return r;
}

/* ================================================================== BOOT */
async function start(key, payload, remember) {
  AES = key; SEED = payload.seed; EXPECT = payload.expect || {}; SITE = payload.site || null;
  if (remember) try { localStorage.setItem(KEYKEY, b64(new Uint8Array(await crypto.subtle.exportKey('raw', key)))); } catch (e) { }
  S = await load();
  try { Object.assign(UI, JSON.parse(localStorage.getItem(UIKEY) || '{}')); } catch (e) { }
  UI.docStage = null;
  const hashTab = location.hash.slice(1);
  if (['days', 'work', 'calc', 'status', 'docs', 'settings'].includes(hashTab)) UI.tab = hashTab;
  $('#lock').hidden = true; document.body.classList.remove('locked');
  render();
  saveNow();                                      // (re)encrypts what is stored
  const st = selfTest();
  if (!st.every(x => x.pass)) console.error('Self-check failed', st.filter(x => !x.pass));
}
async function boot() {
  const err = $('#lockErr'), pw = $('#lockPw'), card = $('#lockForm');
  if (!VAULT || !(window.crypto && crypto.subtle)) { err.textContent = 'Ez a böngésző nem tudja megnyitni (HTTPS kell). / This browser cannot open it (needs HTTPS).'; return; }
  if (VAULT.numeric) pw.inputMode = 'numeric';
  const saved = (() => { try { return localStorage.getItem(KEYKEY); } catch (e) { return null; } })();
  if (saved) {
    try {
      const key = await crypto.subtle.importKey('raw', unb64(saved), 'AES-GCM', true, ['encrypt', 'decrypt']);
      const payload = await openVault(key);
      return start(key, payload, false);
    } catch (e) { try { localStorage.removeItem(KEYKEY); } catch (e2) { } }
  }
  card.onsubmit = async e => {
    e.preventDefault();
    const btn = card.querySelector('button'); btn.disabled = true; err.textContent = '…';
    let key, payload;
    try { key = await deriveKey(pw.value); payload = await openVault(key); }
    catch (x) {
      err.textContent = 'Hibás jelszó / Wrong password'; pw.value = ''; btn.disabled = false;
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); pw.focus(); return;
    }
    err.textContent = ''; btn.disabled = false;
    start(key, payload, $('#lockRemember').checked);
  };
  pw.focus();
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (S && T.en['tabt_' + h]) { UI.tab = h; render(); } });
boot();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
